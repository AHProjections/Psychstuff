name: SilentDisco
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"

targets:
  SilentDisco:
    type: application
    platform: iOS
    sources:
      - SilentDisco
    info:
      path: SilentDisco/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.silentdisco
        DEVELOPMENT_TEAM: ""           # Set your Apple Developer Team ID here
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: SilentDisco/SilentDisco.entitlements
      properties:
        com.apple.developer.musickit: true
        com.apple.security.application-groups: []

    # Spotify iOS SDK — add once you have your Client ID
    # Uncomment and update the URL to the latest release tag
    # packages:
    #   SpotifyiOS:
    #     url: https://github.com/spotify/ios-sdk
    #     from: "1.0.0"

schemes:
  SilentDisco:
    build:
      targets:
        SilentDisco: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
